# Render blueprint for the backend and database. The UI is deployed by Vercel (root directory: taxeaseui).
# The backend needs about 1 GB RAM; Render's 512 MB instances will run out of memory.
services:
  - type: web
    name: taxassist-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taxassist-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://tax-ease-ep2t.vercel.app

databases:
  - name: taxassist-db
    databaseName: taxassist
    user: taxassist
    plan: free
